    <circle cx="150" cy="99" r="19.5" fill="#F3EBDA"/>
    <circle cx="55" cy="99" r="15" fill="#2B2220"/>
    <circle cx="150" cy="99" r="15" fill="#2B2220"/>
    <circle cx="55.5" cy="99" r="5.5" fill="#E2A52E"/>
    <circle cx="149.5" cy="99" r="5.5" fill="#E2A52E"/>
